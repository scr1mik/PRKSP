services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: future-events-backend
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
      HOST: ${HOST}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      API_PREFIX: ${API_PREFIX}
      DEBUG: ${DEBUG}
    ports:
      - "${PORT}:${PORT}"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: future-events-frontend
    depends_on:
      - backend
    environment:
      BACKEND_PORT: ${PORT}
    ports:
      - "8080:80"

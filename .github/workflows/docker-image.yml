name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Deployment environment
        required: true
        default: staging

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set image reference
        id: image
        run: echo "image-ref=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:run-${{ github.run_number }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate deployment database configuration
        run: |
          test -n "${POSTGRES_HOST}"
          test -n "${POSTGRES_DB}"
          test -n "${POSTGRES_USER}"
          test -n "${POSTGRES_PASSWORD}"
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Run database migrations
        run: |
          docker run --rm \
            -e APP_NAME="${APP_NAME}" \
            -e APP_VERSION="${APP_VERSION}" \
            -e APP_ENV="${APP_ENV}" \
            -e HOST="${HOST}" \
            -e PORT="${PORT}" \
            -e POSTGRES_HOST="${POSTGRES_HOST}" \
            -e POSTGRES_PORT="${POSTGRES_PORT}" \
            -e POSTGRES_DB="${POSTGRES_DB}" \
            -e POSTGRES_USER="${POSTGRES_USER}" \
            -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            -e FRONTEND_ORIGIN="${FRONTEND_ORIGIN}" \
            -e ALLOWED_ORIGINS="${ALLOWED_ORIGINS}" \
            -e API_PREFIX="${API_PREFIX}" \
            -e DEBUG="${APP_DEBUG}" \
            -e REDIS_URL="${REDIS_URL}" \
            -e SESSION_COOKIE_NAME="${SESSION_COOKIE_NAME}" \
            -e SESSION_TTL_SECONDS="${SESSION_TTL_SECONDS}" \
            -e IMAGE_TAG="${IMAGE_TAG}" \
            -e RELEASE_ID="${RELEASE_ID}" \
            -e SHUTDOWN_TIMEOUT_SECONDS="${SHUTDOWN_TIMEOUT_SECONDS}" \
            "${IMAGE_REF}" \
            python run.py migrate
        env:
          IMAGE_REF: ${{ needs.build.outputs.image-ref }}
          APP_NAME: ${{ vars.APP_NAME || 'Future Events Tracker' }}
          APP_VERSION: ${{ vars.APP_VERSION || '0.1.0' }}
          APP_ENV: ${{ inputs.target_environment }}
          HOST: ${{ vars.HOST || '0.0.0.0' }}
          PORT: ${{ vars.PORT || '8000' }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '5432' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN || 'http://localhost:5173' }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || '["http://localhost:5173"]' }}
          API_PREFIX: ${{ vars.API_PREFIX || '/api' }}
          APP_DEBUG: ${{ vars.APP_DEBUG || 'false' }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SESSION_COOKIE_NAME: ${{ vars.SESSION_COOKIE_NAME || 'session_id' }}
          SESSION_TTL_SECONDS: ${{ vars.SESSION_TTL_SECONDS || '86400' }}
          IMAGE_TAG: ${{ github.sha }}
          RELEASE_ID: run-${{ github.run_number }}
          SHUTDOWN_TIMEOUT_SECONDS: ${{ vars.SHUTDOWN_TIMEOUT_SECONDS || '10' }}

      - name: Deploy release
        run: |
          echo "Migrations completed for ${IMAGE_REF}"
          echo "Deploy ${IMAGE_REF} to ${APP_ENV} using your hosting provider command here."
        env:
          IMAGE_REF: ${{ needs.build.outputs.image-ref }}
          APP_ENV: ${{ inputs.target_environment }}
